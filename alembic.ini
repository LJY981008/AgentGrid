# alembic 설정 — stockpick PG18 마이그레이션 (ADR-006, 첫 실사용).
# ⚠️ sqlalchemy.url 은 여기 하드코딩하지 않는다 — migrations/env.py 가 compose DATABASE_URL 에서
#    주입(패스워드 비노출·환경별 분리). 실행: docker compose exec app alembic upgrade head.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
