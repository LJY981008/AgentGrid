# Agent Grid Prometheus 설정
# 백엔드에 새 커스텀 메트릭 추가 시: 스크랩은 자동 — Grafana 대시보드(infra/monitoring/grafana/dashboards/)에 패널 추가할 것
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agentgrid-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # 평소 개발: 호스트에서 ./gradlew bootRun (둘 중 하나만 살아 있어도 정상 — down 타겟은 무시)
      - targets: ["host.docker.internal:8080"]
        labels:
          runtime: host
      # --profile app 으로 백엔드 컨테이너 실행 시
      - targets: ["backend:8080"]
        labels:
          runtime: container

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
