spring:
  application:
    name: agentgrid-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/agentgrid
    username: agentgrid
    password: agentgrid-local

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 마이그레이션으로만 관리
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: agentgrid
    password: agentgrid-local

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    com.agentgrid: DEBUG
