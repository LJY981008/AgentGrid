[project]
name = "stockpick"
version = "0.0.1"
description = "개인 투자용 미국 주식 주가 분석 — 30년 데이터 기반 Top20 정량 생성 → 수동 Top5 → 분산투자 추적"
requires-python = ">=3.12"
# 런타임 의존성(pandas·pyarrow·duckdb·tiingo 등)은 B-pipeline 단계에서 `uv add` 로 실측 고정 — 추측 고정 금지
dependencies = [
    "alembic>=1.18.4",
    "duckdb>=1.5.3",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=8,<9",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "uvicorn[standard]>=0.50.0",
]

# 개발 도구는 PEP 735 dependency-group(uv 네이티브) — `uv sync` 가 기본 설치.
#   optional-dependencies(extra) 와 달리 published 패키지에 안 섞이고 `--extra` 없이 설치됨.
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockpick"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 실패 명확 보고 원칙(stock-1st_plan §4.1) — 빈 except·광역 except 금지(BLE), 보안(S), 버그(B)
select = ["E", "F", "I", "B", "BLE", "UP", "S"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 관례: 라우트 기본값의 Depends()/Query() 는 함수 호출이지만 의도된 패턴(B008 오탐).
# 이 두 호출만 immutable 로 허용 — 일반 가변 기본값(예: list())은 여전히 B008 로 잡힌다.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# 테스트는 assert 가 정상 패턴(S101) — pytest 단언
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 라이브 데이터 의존 테스트는 CI 금지 — 픽스처/모킹 기반 (생존편향·차단 회피)
addopts = "-q"
