# stockpick 로컬 오케스트레이션
#   docker compose up -d   → PostgreSQL (운영 서빙용)
# 벌크 백테스트 데이터는 Parquet 파일(DB 아님). PG 는 일일 갱신·운영 조회용.
# Redis/RabbitMQ/모니터링은 도메인 전환으로 제거 — 필요해지면 그때 추가.
name: stockpick

services:
  # 개발/실행 컨테이너 — uv 기반 재현 환경(어디서 돌려도 동일: uv.lock + 이미지 고정).
  #   상주(sleep infinity)로 띄우고 검증은 `docker compose exec app ...` 또는
  #   `docker compose run --rm app ...` 로 실행.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockpick-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 컨테이너 내부에서 PG 접속 — 호스트가 아니라 서비스명 postgres:5432
      DATABASE_URL: postgresql://stockpick:stockpick-local@postgres:5432/stockpick
      PYTHONPATH: src
      # 데이터 소스 API 키 — 호스트 .env(gitignore·이미지 미포함)에서 interpolation 주입.
      #   라이브 수집·파일럿 실행용. 미설정 시 빈값(테스트는 모킹이라 불필요). 적용엔 컨테이너 재생성:
      #   docker compose up -d --no-deps app
      TIINGO_API_KEY: "${TIINGO_API_KEY:-}"  # M1 파일럿 가격(현재상장)
      EODHD_API_KEY: "${EODHD_API_KEY:-}"  # M2 본격 가격(폐지 포함, ADR-003)
    volumes:
      # 개발용 바인드 마운트 — 소스 수정 즉시 컨테이너 반영(재빌드 불필요).
      #   editable 설치된 .pth(=/app/src) 위로 호스트 ./src 가 덮여 경로 동일.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      # ⚠️ .venv 는 마운트하지 않음 — 호스트엔 .venv 없고, 이미지의 .venv(컨테이너 플랫폼 빌드)를 써야 함.
    # 코드가 아직 서버/CLI 진입점 없음 — 상주만(Dockerfile CMD 와 동일, 명시).
    command: ["sleep", "infinity"]

  postgres:
    image: postgres:18-alpine
    container_name: stockpick-postgres
    environment:
      POSTGRES_DB: stockpick
      POSTGRES_USER: stockpick
      POSTGRES_PASSWORD: stockpick-local
    ports:
      - "5432:5432"
    volumes:
      # PG18: 마운트는 상위 /var/lib/postgresql (AiCrawl 실측 — /data 마운트 시 기동 거부)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpick -d stockpick"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
