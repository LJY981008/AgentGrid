name: agentgrid

services:
  postgres:
    image: postgres:18-alpine
    container_name: agentgrid-postgres
    environment:
      POSTGRES_DB: agentgrid
      POSTGRES_USER: agentgrid
      POSTGRES_PASSWORD: agentgrid-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgrid -d agentgrid"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: agentgrid-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: agentgrid-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: agentgrid
      RABBITMQ_DEFAULT_PASS: agentgrid-local
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
