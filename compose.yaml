# stockpick 로컬 오케스트레이션
#   docker compose up -d   → PostgreSQL (운영 서빙용)
# 벌크 백테스트 데이터는 Parquet 파일(DB 아님). PG 는 일일 갱신·운영 조회용.
# Redis/RabbitMQ/모니터링은 도메인 전환으로 제거 — 필요해지면 그때 추가.
name: stockpick

services:
  postgres:
    image: postgres:18-alpine
    container_name: stockpick-postgres
    environment:
      POSTGRES_DB: stockpick
      POSTGRES_USER: stockpick
      POSTGRES_PASSWORD: stockpick-local
    ports:
      - "5432:5432"
    volumes:
      # PG18: 마운트는 상위 /var/lib/postgresql (AiCrawl 실측 — /data 마운트 시 기동 거부)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpick -d stockpick"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
