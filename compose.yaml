# stockpick 로컬 오케스트레이션 — 풀스택 로컬 실행(M3 C층)
#   docker compose up -d   → postgres(운영 서빙) + app(FastAPI:8000) + web(Vite dev:5173)
#   브라우저: http://localhost:5174 (web)  ·  API 직접: http://localhost:8000
# 벌크 백테스트 데이터는 Parquet 파일(DB 아님). PG 는 일일 갱신·운영 조회용.
# 관측성(ADR-008·2026-06-23): prometheus+grafana+pushgateway 상시 + profiler(on-demand·profiling 프로필).
#   백테스트 perf·API 지연·호스트 메모리 모니터링 + 최적화 라운드 Grafana 스냅샷.
#
# ⚠️ 외부망 노출 차단: 전 서비스 127.0.0.1 바인딩 — 개인 1인 로컬·인증 없음.
# ⚠️ 호스트 포트 리맵(타 프로젝트 AiCrawl 점유 실측): postgres 5432→5433·web 5173→5174·
#     grafana 3000→3001(호스트 3000 점유 실측). prometheus 9090·pushgateway 9091. 컨테이너 내부 불변.
name: stockpick

services:
  # API 서버 + 개발/검증 컨테이너 — uv 기반 재현 환경(uv.lock + 이미지 고정).
  #   uvicorn 상주(0.0.0.0:8000)로 떠 있어도 `docker compose exec app ...` 로 ruff/mypy/pytest·uv add 그대로 가능.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockpick-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 컨테이너 내부에서 PG 접속 — 호스트가 아니라 서비스명 postgres:5432 (호스트 리맵 5433과 무관).
      DATABASE_URL: postgresql://stockpick:stockpick-local@postgres:5432/stockpick
      PYTHONPATH: src
      # 데이터 소스 API 키 — 호스트 .env(gitignore·이미지 미포함)에서 interpolation 주입.
      #   라이브 수집·파일럿 실행용. 미설정 시 빈값(테스트는 모킹이라 불필요). 적용엔 컨테이너 재생성:
      #   docker compose up -d --no-deps app
      TIINGO_API_KEY: "${TIINGO_API_KEY:-}"  # M1 파일럿 가격(현재상장)
      EODHD_API_KEY: "${EODHD_API_KEY:-}"  # M2 본격 가격(폐지 포함, ADR-003)
      EDGAR_IDENTITY: "${EDGAR_IDENTITY:-}"  # SEC EDGAR User-Agent 신원(이름+이메일, 키 아님·#2)
    ports:
      # ⚠️ 호스트 localhost 만 — 외부망 노출 차단(인증 없음·1인 로컬).
      - "127.0.0.1:8000:8000"
    volumes:
      # 개발용 바인드 마운트 — 소스 수정 즉시 컨테이너 반영(재빌드 불필요).
      #   editable 설치된 .pth(=/app/src) 위로 호스트 ./src 가 덮여 경로 동일.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      # alembic 마이그레이션(ADR-006) — env.py 가 DATABASE_URL 로 PG 접속. 런타임 마운트로 반영.
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      # ⭐ 데이터 영속 — named volume(Docker 관리·app 소유·재생성에도 유지). ⚠️ 호스트 바인드는
      #   uid 불일치(호스트 1000 vs 컨테이너 app 999)로 Parquet 쓰기 거부 → named volume 으로 회피
      #   (Dockerfile 이 /app/data 를 app 소유로 생성 → 볼륨이 그 소유권 상속, 쓰기 가능·포터블).
      - parquet-data:/app/data
      # ⭐ 학습 노트 — /api/learning/* · /learning-assets 서빙 루트.
      #   .dockerignore 가 docs 를 이미지에서 제외하나, 이 런타임 바인드가 덮어 노출(의도대로).
      - ./docs:/app/docs
      # ⚠️ .venv 는 마운트하지 않음 — 호스트엔 .venv 없고, 이미지의 .venv(컨테이너 플랫폼 빌드)를 써야 함.
    # FastAPI(uvicorn 0.0.0.0:8000) 상주 — `python -m stockpick.api`(__main__.py 진입점).
    command: ["python", "-m", "stockpick.api"]
    # 메모리 상한(2026-06-18 OOM 인시던트 대응) — `ParquetPriceSeriesPort.full_series()` 가 전구간
    #   전체 ticker 를 메모리 로드(adapters.py:35-38)해 호스트 31Gi 를 다 먹고 커널이 컨테이너를
    #   OOM-kill → 같은 컨테이너의 풀백필(bulk)까지 동반 사망(ExitCode 137). app 만 상한 격리:
    #   초과 시 app 만 죽고 postgres·진행중 bulk·호스트 보호. ⚠️ 정상 백테스트도 대용량에선 이 한도에
    #   걸릴 수 있음 = full_series 구조 결함(DuckDB 집계/스트리밍 전환)은 S6 선결 백로그.
    mem_limit: 12g

  # 프론트(Vite dev) — PWA 대시보드. 소스 바인드 + node_modules 익명볼륨(호스트가 컨테이너 것을 안 덮음).
  #   vite proxy(/api·/learning-assets)는 컨테이너 내부에서 app:8000 이 아니라 호스트 기준이므로,
  #   브라우저가 same-origin(5174→컨테이너 5173)으로 호출하면 vite 가 VITE_DEV_API_TARGET 로 프록시.
  web:
    image: node:22
    container_name: stockpick-web
    working_dir: /app
    depends_on:
      - app
    environment:
      # vite proxy 대상 — 컨테이너 내부 네트워크에서 app 서비스(8000)로. (vite.config.ts VITE_DEV_API_TARGET)
      VITE_DEV_API_TARGET: "http://app:8000"
    ports:
      # ⚠️ 호스트 5173 은 타 프로젝트(AiCrawl vite) 점유 → 5174 로 리맵. 컨테이너 내부는 5173 불변.
      - "127.0.0.1:5174:5173"
    volumes:
      - ./webapp:/app
      # node_modules 는 익명볼륨 — 컨테이너 내부 설치본 유지(호스트 빈 디렉토리가 덮지 않게).
      - /app/node_modules
    # 첫 기동 install(node_modules 익명볼륨이라 호스트 안 덮음) 후 dev 서버. --host 로 컨테이너 외부 바인드.
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]

  postgres:
    image: postgres:18-alpine
    container_name: stockpick-postgres
    environment:
      POSTGRES_DB: stockpick
      POSTGRES_USER: stockpick
      POSTGRES_PASSWORD: stockpick-local
    ports:
      # ⚠️ 호스트 5432 는 타 프로젝트(aicrawl-postgres) 점유 → 5433 으로 리맵. 컨테이너 내부 5432 불변.
      - "127.0.0.1:5433:5432"
    volumes:
      # PG18: 마운트는 상위 /var/lib/postgresql (AiCrawl 실측 — /data 마운트 시 기동 거부)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpick -d stockpick"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 관측성 스택(ADR-008) ──────────────────────────────────────────────
  # prometheus: app /metrics(HTTP) + pushgateway(백테스트 perf round) + profiler(라이브 곡선) scrape.
  prometheus:
    image: prom/prometheus:v3.12.0  # ⚠️ latest=2.x(tech 실측·v3 명시 핀)
    container_name: stockpick-prometheus
    depends_on:
      - app
      - pushgateway
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus  # 시계열 영속(라이브 메트릭 히스토리)
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  # pushgateway: 25분 배치(profiler)는 pull 로 못 잡음(종료 시 소멸) → round 요약 push 보존.
  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: stockpick-pushgateway
    ports:
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  # grafana: 레이어 대시보드(provisioning as-code) + Local Snapshot(최적화 before/after·grafana.db 영속).
  grafana:
    image: grafana/grafana:13.0.2
    container_name: stockpick-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # 1인 로컬·인증 없음(app·web 동일 철학)
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"  # 스냅샷 생성 권한
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana  # ⭐ grafana.db SQLite — Local Snapshot before/after 영속
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # ⚠️ 호스트 3000 점유(실측) → 3001 리맵. 컨테이너 내부 3000 불변.
      - "127.0.0.1:3001:3000"

  # profiler(on-demand·profiles:["profiling"]): 풀 백테스트 phase/peak 측정·라이브 /metrics(9100).
  #   ⚠️ app 정지 후 격리 실행(11.7GB+12g OOM 회피·CLAUDE.md 벌크 규약):
  #     docker compose stop app web
  #     STOCKPICK_PROFILE_ROUND=before docker compose --profile profiling up profiler
  #   prometheus 가 profiler:9100 scrape(라이브 RSS·phase 곡선)·종료 시 pushgateway round 푸시.
  profiler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockpick-profiler
    profiles: ["profiling"]
    depends_on:
      postgres:
        condition: service_healthy
      pushgateway:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://stockpick:stockpick-local@postgres:5432/stockpick
      PYTHONPATH: src
      PUSHGATEWAY_URL: "pushgateway:9091"
      STOCKPICK_PROFILE_ROUND: "${STOCKPICK_PROFILE_ROUND:-adhoc}"
      STOCKPICK_PROFILE_METRICS_PORT: "9100"
    volumes:
      - ./src:/app/src
      - parquet-data:/app/data  # cache.duckdb·Parquet·edgar·snapshot(read)
    command: ["python", "-m", "stockpick.backtest.profile"]
    mem_limit: 12g  # app 정지 후 격리이므로 단독 12g 점유

volumes:
  postgres-data:
  parquet-data:  # 수집 Parquet 영속(app 소유·호스트 uid 무관)
  prometheus-data:  # 관측성 시계열 영속
  grafana-data:  # ⭐ Grafana 대시보드·Local Snapshot 영속(before/after 동결)
