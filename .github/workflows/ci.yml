name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    # PG18 서비스 — data/db.py·test_db.py PG repo 테스트용(로컬 인프라, 라이브 외부데이터 아님).
    # 없으면 test_db.py 가 skip 되어 S5-a 핵심 신규 코드가 CI 미검증으로 남음.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stockpick
          POSTGRES_USER: stockpick
          POSTGRES_PASSWORD: stockpick-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockpick -d stockpick"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # GitHub Actions services 는 러너 localhost 로 포트 매핑.
      DATABASE_URL: postgresql://stockpick:stockpick-local@localhost:5432/stockpick
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --all-extras
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Format check (ruff)
        run: uv run ruff format --check src tests
      - name: Type check (mypy)
        run: uv run mypy
      - name: Migrate (alembic upgrade head)
        run: uv run alembic upgrade head
      - name: Test (pytest)
        run: PYTHONPATH=src uv run pytest -q

  webapp:
    name: Webapp (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install deps (npm ci)
        run: npm ci
      - name: Build (tsc -b + vite build = 타입체크 포함)
        run: npm run build

  harness:
    name: Harness (훅 회귀 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Hook regression tests
        run: .claude/hooks/tests/run.sh
