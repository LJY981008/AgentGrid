name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --all-extras
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Format check (ruff)
        run: uv run ruff format --check src tests
      - name: Type check (mypy)
        run: uv run mypy
      - name: Test (pytest)
        run: PYTHONPATH=src uv run pytest -q

  webapp:
    name: Webapp (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install deps (npm ci)
        run: npm ci
      - name: Build (tsc -b + vite build = 타입체크 포함)
        run: npm run build

  harness:
    name: Harness (훅 회귀 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook regression tests
        run: .claude/hooks/tests/run.sh
